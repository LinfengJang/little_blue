<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>小蓝 · 活泼版</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eff4fb;color:#27364c;font:16px/1.65 system-ui,sans-serif}main{max-width:1040px;margin:32px auto;padding:24px}h1{font-size:32px;margin:0}p{color:#55667f}.tag{font-size:13px;color:#3266aa}.compare{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:24px 0}.panel{background:#fff;border:1px solid #d9e2ef;border-radius:22px;text-align:center;overflow:hidden}.panel h2{font-size:16px;margin:17px 0 0}.stage{height:280px;display:grid;place-items:center;touch-action:none;overflow:hidden}.sprite{width:192px;height:208px;background-size:1536px 2288px;background-repeat:no-repeat;user-select:none}.old{background-image:url('preview-assets/original.webp')}.new{background-image:url('bluebell-playful/spritesheet.webp');cursor:grab}#controls{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;color:#27364c;border:1px solid #cbd8ea;border-radius:30px;padding:8px 16px;background:white;cursor:pointer}button.active{background:#386ea7;color:white;border-color:#386ea7}.note{font-size:13px}a{color:#3266aa}.tools{margin-top:22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.toast{height:26px;font-size:14px;color:#34679f}.hidden{display:none}@media(max-width:550px){main{padding:15px}.compare{gap:8px}.stage{height:230px}.sprite{transform:scale(.8)}h1{font-size:26px}}
</style>
<main><div class="tag">BLUEBELL · PLAYFUL EDITION</div><h1>小蓝，现在更有表情了</h1><p>同一角色、同一播放节奏。选择动作，对比新版的手势、表情和身体变化。</p><div class="compare"><section class="panel"><h2>上一版</h2><div class="stage"><div class="sprite old" aria-label="上一版宠物"></div></div></section><section class="panel"><h2>活泼版</h2><div class="stage" id="playstage"><div class="sprite new" aria-label="活泼版宠物"></div></div><div class="toast" id="toast"></div></section></div><div id="controls"></div><div class="tools"><button id="play">开启互动试玩</button><button id="pause">暂停</button><label><input type="checkbox" id="dark"> 深色背景</label></div><p id="hint" class="note hidden">试玩操作：移动鼠标让她看你，单击打招呼，双击开心欢呼，拖动左右移动。<strong>这些鼠标触发逻辑仅在本预览页生效；导入 ChatGPT 后由客户端控制。</strong></p><p class="note">原生资源仍是 9 类状态＋16 个注视方向，本版重做其中 6 类动画。<a href="导入说明.txt">导入说明</a></p></main>
<script>
const rows=[['待机呼吸',0,[280,110,110,140,140,320]],['右移',1,[120,120,120,120,120,120,120,220]],['左移',2,[120,120,120,120,120,120,120,220]],['开心挥手',3,[140,140,140,280]],['开心欢呼',4,[140,140,140,140,280]],['失落',5,[140,140,140,140,140,140,140,240]],['歪头等你',6,[150,150,150,150,150,260]],['认真打字',7,[120,120,120,120,120,220]],['想一想',8,[150,150,150,150,150,280]],['视线环绕',9,Array(16).fill(220)]];
const old=document.querySelector('.old'),fresh=document.querySelector('.new'),stage=document.querySelector('#playstage'),controls=document.querySelector('#controls'),toast=document.querySelector('#toast');let timer,selected=3,frame=0,play=false,paused=false,temporary=false,drag=null,lastDragAt=0,clickTimer;
function cell(node,r,c){node.style.backgroundPosition=`${-c*192}px ${-r*208}px`}
function tick(){if(paused)return;const a=rows[selected],r=a[1]===9?9+Math.floor(frame/8):a[1],c=a[1]===9?frame%8:frame;cell(old,r,c);cell(fresh,r,c);let delay=a[2][frame];frame=(frame+1)%a[2].length;if(frame===0&&temporary){timer=setTimeout(()=>{temporary=false;select(0)},delay);return}timer=setTimeout(tick,delay)}
function select(i,once=false){clearTimeout(timer);selected=i;frame=0;temporary=once;controls.querySelectorAll('button').forEach((b,j)=>b.classList.toggle('active',j===i));tick()}
rows.forEach((a,i)=>{const b=document.createElement('button');b.textContent=a[0];b.onclick=()=>select(i);controls.append(b)});
document.querySelector('#play').onclick=e=>{play=!play;e.target.textContent=play?'退出互动试玩':'开启互动试玩';document.querySelector('#hint').classList.toggle('hidden',!play);toast.textContent=play?'把鼠标移过来，和小蓝打个招呼':' ';select(0)};
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'继续播放':'暂停';clearTimeout(timer);if(!paused)tick()};
document.querySelector('#dark').onchange=e=>document.querySelectorAll('.stage').forEach(s=>s.style.background=e.target.checked?'#25324a':'#fff');
stage.addEventListener('pointermove',e=>{if(!play||paused)return;if(drag){const dx=e.clientX-drag.x;drag.distance=Math.max(drag.distance,Math.abs(dx));if(Math.abs(dx)>5){const index=dx>0?1:2;if(selected!==index)select(index);fresh.style.translate=`${Math.max(-75,Math.min(75,dx))}px 0`}return}if(temporary)return;clearTimeout(timer);const b=fresh.getBoundingClientRect(),dx=e.clientX-b.left-b.width/2,dy=e.clientY-b.top-b.height/2;if(Math.hypot(dx,dy)<23){cell(fresh,0,6);cell(old,0,6);return}const n=Math.round(((Math.atan2(dx,-dy)*180/Math.PI+360)%360)/22.5)%16;cell(fresh,9+Math.floor(n/8),n%8);cell(old,9+Math.floor(n/8),n%8)});
fresh.addEventListener('pointerdown',e=>{if(!play||paused)return;drag={x:e.clientX,distance:0};fresh.setPointerCapture(e.pointerId)});
fresh.addEventListener('pointerup',()=>{if(!drag)return;const moved=drag.distance>6;drag=null;fresh.style.translate='';if(moved){lastDragAt=Date.now();toast.textContent='到啦！';select(4,true)}});
fresh.addEventListener('pointercancel',()=>{drag=null;fresh.style.translate='';select(0)});
fresh.addEventListener('click',()=>{if(!play||paused||Date.now()-lastDragAt<300)return;clearTimeout(clickTimer);clickTimer=setTimeout(()=>{toast.textContent='嗨，我在这里！';select(3,true)},220)});
fresh.addEventListener('dblclick',()=>{if(!play||paused)return;clearTimeout(clickTimer);toast.textContent='好耶！';select(4,true)});
stage.addEventListener('pointerleave',()=>{if(play&&!drag&&!temporary)select(0)});select(3);
</script></html>
